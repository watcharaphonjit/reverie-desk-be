name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Lint, typecheck, jest, integration smoke against ephemeral Postgres + Redis.
# Runs on every PR. Build artefact is uploaded so a follow-up deploy
# workflow can promote without re-building.

jobs:
  lint:
    name: Lint
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0

  typecheck:
    name: Typecheck
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --ci --runInBand

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [unit, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reverie_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d reverie_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://test:test@localhost:5432/reverie_test
      JWT_SECRET: ci-jwt-secret-please-rotate-32b
      JWT_EXPIRES_IN: 1h
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      LOG_LEVEL: silent
      THROTTLE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:e2e -- --ci --runInBand

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
