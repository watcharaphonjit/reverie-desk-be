name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (defaults to commit SHA short)'
        required: false
        type: string

# Build a multi-stage docker image and push to GHCR. The deploy step
# itself (rolling update) is environment-specific — wire it to ECS,
# Kubernetes, or your platform of choice. The `prod-image` job emits a
# tag any downstream pipeline can consume.

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prod-image:
    name: Build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@placeholder/placeholder' }}
            JWT_SECRET=${{ secrets.JWT_SECRET || 'change-me-change-me-change-me' }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '12h' }}
            REDIS_HOST=${{ secrets.REDIS_HOST || 'reverie-desk-be.railway.internal' }}
            REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL || 'info' }}
            ENABLE_QUEUES=${{ secrets.ENABLE_QUEUES || 'true' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}" >> $GITHUB_STEP_SUMMARY
